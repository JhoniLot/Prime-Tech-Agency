<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100" fill="none">
    <defs>
        <linearGradient id="logo-blue-grad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d2ff"/>
            <stop offset="100%" stop-color="#0055ff"/>
        </linearGradient>
        <linearGradient id="logo-navy-grad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0044cc"/>
            <stop offset="100%" stop-color="#000b26"/>
        </linearGradient>
        <mask id="logo-arrow-mask">
            <rect x="0" y="0" width="100" height="100" fill="white"/>
            <path d="M 12 76 L 28 46 L 42 62 L 76 28" stroke="black" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <polygon points="82,22 68,22 82,36" fill="black" stroke="black" stroke-width="4" stroke-linejoin="round"/>
        </mask>
        <style>
            .brand-name {
                font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
                font-weight: 700;
                font-size: 32px;
                fill: #ffffff;
            }
            .brand-accent {
                fill: #00d2ff;
            }
            .brand-sub {
                font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
                font-weight: 600;
                font-size: 11px;
                fill: #94a3b8;
                letter-spacing: 5px;
            }
        </style>
    </defs>
    <!-- Logo Monogram -->
    <g transform="translate(10, 10)" mask="url(#logo-arrow-mask)">
        <rect x="28" y="46" width="7" height="30" rx="2" fill="url(#logo-navy-grad)" />
        <rect x="42" y="34" width="7" height="42" rx="2" fill="url(#logo-navy-grad)" />
        <rect x="56" y="22" width="7" height="54" rx="2" fill="url(#logo-navy-grad)" />
        <rect x="70" y="10" width="7" height="66" rx="2" fill="url(#logo-navy-grad)" />
    </g>
    <g transform="translate(10, 10)">
        <path d="M 12 76 L 28 46 L 42 62 L 76 28" stroke="url(#logo-blue-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <polygon points="82,22 68,22 82,36" fill="url(#logo-blue-grad)" stroke="url(#logo-blue-grad)" stroke-width="2" stroke-linejoin="round"/>
    </g>
    <!-- Brand Text -->
    <text x="110" y="52" class="brand-name">Prime Tech <tspan class="brand-accent">Agency</tspan></text>
    <text x="112" y="72" class="brand-sub">TRÁFEGO &amp; GROWTH</text>
</svg>