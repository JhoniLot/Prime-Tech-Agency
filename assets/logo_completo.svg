<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="450" height="100" fill="none">
    <defs>
        <linearGradient id="logo-blue-grad" x1="30" y1="20" x2="80" y2="70" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00d2ff"/>
            <stop offset="40%" stop-color="#0066ff"/>
            <stop offset="100%" stop-color="#001144"/>
        </linearGradient>
        <linearGradient id="logo-navy-grad" x1="45" y1="35" x2="60" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0055ff"/>
            <stop offset="100%" stop-color="#000b26"/>
        </linearGradient>
        <style>
            .brand-name {
                font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
                font-weight: 700;
                font-size: 32px;
                fill: #ffffff;
            }
            .brand-accent {
                fill: #00d2ff;
            }
            .brand-sub {
                font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
                font-weight: 600;
                font-size: 11px;
                fill: #94a3b8;
                letter-spacing: 5px;
            }
        </style>
    </defs>
    <!-- Logo Monogram -->
    <g transform="translate(10, 10)">
        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M34.5 28.5L44.5 18.5H70C81 18.5 87.5 25 87.5 35C87.5 45 81 51.5 70 51.5H57.5L51.5 45.5H70C76 45.5 80.5 42 80.5 35C80.5 28 76 25.5 70 25.5H48.5L34.5 39.5V28.5Z" fill="url(#logo-blue-grad)"/>
            <path d="M35 40C35 34.5 38.5 29.5 44 29.5C45.5 29.5 45.5 35 45.5 38.5V57L35 67.5V40Z" fill="url(#logo-blue-grad)"/>
            <path d="M50 36.5H57.5V49L50 56.5V36.5Z" fill="url(#logo-navy-grad)"/>
        </svg>
    </g>
    <!-- Brand Text -->
    <text x="110" y="52" class="brand-name">Prime Tech <tspan class="brand-accent">Agency</tspan></text>
    <text x="112" y="72" class="brand-sub">TRÁFEGO PAGO</text>
</svg>
